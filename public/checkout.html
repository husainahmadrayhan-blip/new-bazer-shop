<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অর্ডার করুন | নতুন বাজার</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">নতুন<span>বাজার</span></a><a href="/">শপে ফিরুন</a></header><main><h1>অর্ডার ও ডেলিভারি তথ্য</h1><div class="checkout-layout"><section class="box checkout-items"><h2>আপনার পণ্য</h2><div id="items">লোড হচ্ছে...</div><h2 id="total"></h2></section><form id="checkoutForm" class="box checkout-form"><h2>গ্রাহকের তথ্য</h2><label>আপনার নাম<input name="customer" required maxlength="120"></label><label>মোবাইল নম্বর<input name="phone" type="tel" required minlength="8" maxlength="20" placeholder="01XXXXXXXXX"></label><label>সম্পূর্ণ ডেলিভারি ঠিকানা<textarea name="address" required rows="3"></textarea></label><label>অর্ডার নোট (ঐচ্ছিক)<textarea name="note" rows="2"></textarea></label><div class="cod">পেমেন্ট: ক্যাশ অন ডেলিভারি (পণ্য হাতে পেয়ে টাকা দিন)</div><button class="primary" type="submit">অর্ডার নিশ্চিত করুন</button><p id="message"></p></form></div></main><script src="/checkout.js"></script></body></html>
