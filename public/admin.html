<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | নতুন বাজার</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">নতুন<span>বাজার</span></a><a href="/">শপে ফিরুন</a></header><main><section id="login" class="box narrow"><h1>অ্যাডমিন লগইন</h1><form id="loginform"><label>Username<input name="username" value="admin" required></label><label>Password<input name="password" type="password" required></label><button class="primary">লগইন</button></form><p id="loginmsg"></p></section><section id="dash" class="hidden"><h1>অ্যাডমিন ড্যাশবোর্ড</h1><div class="stats" id="stats"></div><div class="box"><h2>নতুন পণ্য যোগ করুন</h2><form id="productform" class="formgrid" enctype="multipart/form-data"><label>পণ্যের নাম<input name="name" required></label><label>ক্যাটাগরি<select name="category"><option>ইলেকট্রনিক</option><option>মোবাইল আইটেম</option><option>উপহার সামগ্রী</option><option>পোশাক</option></select></label><label>বিক্রয় মূল্য<input name="price" type="number" min="0" required></label><label>আগের মূল্য<input name="oldPrice" type="number" min="0"></label><label>স্টক<input name="stock" type="number" min="0" value="1"></label><label class="wide">পণ্যের ছবি (একসঙ্গে সর্বোচ্চ ১০টি, প্রতিটি ৩ MB পর্যন্ত)<input id="productImages" name="images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><small>ছবি বেছে নিলে নিচে প্রিভিউ দেখাবে।</small><div id="imagePreview" class="admin-image-preview"></div></label><label class="wide">বিবরণ<textarea name="description"></textarea></label><button class="primary">পণ্য যোগ করুন</button></form><p id="pmsg" role="status" aria-live="polite"></p><h2>পণ্য তালিকা</h2><div id="plist"></div></div><div class="box"><h2>অর্ডার হিস্ট্রি</h2><div id="orders"></div></div><div class="box"><h2>Facebook Marketing</h2><p>পণ্য বেছে Share Product চাপুন। Facebook থেকে আসা অর্ডার ও ডেলিভারি বিক্রি এখানে দেখা যাবে।</p><div id="marketing"></div></div><div class="box"><h2>ভিজিট ও জনপ্রিয় পণ্য</h2><div id="analytics"></div></div></section></main><script src="/admin.js"></script></body></html>
